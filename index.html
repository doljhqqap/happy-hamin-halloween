ventListener('click',dodge);document.getElementById('again').onclick=()=>{typed='';updateDots();no.removeAttribute('style');no.removeAttribute('data-dodged');no.textContent='아직못해쏘';show('lock');window.scrollTo({top:0,behavior:'smooth'})};document.getElementById('candy').onclick=()=>{const bits=['🍬','🍭','✨','🎃','👻','🖤'];for(let i=0;i<26;i++){const x=document.createElement('span');x.className='burst';x.textContent=bits[Math.floor(Math.random()*bits.length)];x.style.left=(45+Math.random()*10)+'vw';x.style.top=(40+Math.random()*15)+'vh';x.style.setProperty('--x',(Math.random()*1000-500)+'px');x.style.setProperty('--y',(Math.random()*-900-100)+'px');document.body.append(x);setTimeout(()=>x.remove(),1700)}};
